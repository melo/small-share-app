<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img"
     aria-label="share">
  <!-- The iOS share glyph: a box open at the top with an arrow leaving it.
       Drawn rather than fetched, so it costs one small same-origin request and
       nothing off the local network.

       currentColor plus a prefers-color-scheme rule, so the mark stays legible
       on a light tab strip and on a dark one. Browsers that ignore the style
       block still get the light value. -->
  <style>
    :root { color: #1f2328; }
    @media (prefers-color-scheme: dark) { :root { color: #e6edf3; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- the box, open where the arrow comes out -->
    <path d="M8.5 10.5H6.5A2.5 2.5 0 0 0 4 13v6.5A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V13a2.5 2.5 0 0 0-2.5-2.5h-2" />
    <!-- the shaft -->
    <path d="M12 15V3" />
    <!-- the head -->
    <path d="M7.75 7.25 12 3l4.25 4.25" />
  </g>
</svg>
