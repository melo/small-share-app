# Publish multi-arch images to GHCR and, if it is configured, Docker Hub.
#
# RELEASES ONLY. A tag `v1.2.3` publishes :1.2.3, :1.2, :1 and :latest.
# Nothing else publishes anything.
#
# linux/amd64 ONLY, for now, and that is a regression being carried
# deliberately — see the note on `platforms` in the build step. arm64 is built
# on every non-main branch by `multiarch.yml`, which is where the fix is being
# worked out.
#
# A push to main used to publish :main and :edge, amd64 only. It no longer does.
# The point of that was a way to try the newest commit without cutting a
# release, and the cost was every merge paying for a registry push and a
# provenance attestation — for tags whose only documented use was "try the
# newest commit". `ci.yml` already builds and tests every push to main, which
# is the part that was actually load-bearing; it just does not push the result
# anywhere. Anyone who needs an unreleased build can `docker build .`.
#
# workflow_dispatch is kept as the handle for re-running a release whose publish
# failed — run it from the TAG. It refuses to run from anything else, because a
# manual publish off a branch is how :latest ends up meaning something nobody
# can identify later.
#
# GHCR needs no secrets: the built-in GITHUB_TOKEN plus `packages: write` below
# is enough.
#
# Docker Hub is OPTIONAL and skipped unless you set it up. See MAINTAINING.md,
# "Publishing from a fork". You need, in the repository's Settings -> Secrets
# and variables -> Actions:
#
#   Secret  DOCKERHUB_TOKEN     an access token from hub.docker.com ->
#                               Account settings -> Personal access tokens,
#                               with Read & Write scope. NOT your password.
#   Secret  DOCKERHUB_USERNAME  the account that owns the token.
#   Variable DOCKERHUB_REPO     optional; the target repository, e.g.
#                               "myuser/small-share-app". Defaults to
#                               <DOCKERHUB_USERNAME>/small-share-app.
#
# With DOCKERHUB_TOKEN unset — which is the case for every fork — the Docker Hub
# steps are skipped and the workflow still succeeds.

name: publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One publish at a time, and never cancel one in flight.
#
# Two runs racing for the same `type=gha` cache scope and the same registry tags
# both take twenty minutes and fail, where either alone takes two. That used to
# happen on every release, because pushing a commit and a tag together fired two
# runs seconds apart; main no longer publishes, so the common case is gone. Kept
# for the ones that remain — two tags pushed at once, or a re-run started while
# the first is still going.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Lets the build attach a signed provenance attestation to the pushed image.
  attestations: write
  id-token: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The trigger above already restricts pushes to tags. This is for
      # workflow_dispatch, which will happily run from any ref you pick in the
      # UI — and a publish off a branch would mint a :latest nobody can identify
      # later. Fail here, before anything is built or logged into.
      - name: Refuse to publish anything that is not a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        # Through the environment, not interpolated into the script: a ref is
        # a name someone else chose, and `${{ }}` pastes it in as shell source.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::$REF is not a release tag. Publishing happens from" \
               "v*.*.* and nowhere else; re-run this workflow from the tag."
          exit 1

      - uses: actions/checkout@v4

      # TEMPORARY: amd64 only. See `platforms` on the build step below.
      #
      # QEMU is still set up, because restoring arm64 should be a one-line
      # change to `platforms` and not an archaeology exercise.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Is Docker Hub configured?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "repo=${{ vars.DOCKERHUB_REPO || format('{0}/small-share-app', secrets.DOCKERHUB_USERNAME) }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN/DOCKERHUB_USERNAME not set — publishing to GHCR only."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.hub.outputs.enabled == 'true' && steps.hub.outputs.repo || '' }}
          # Only ever a release. The guard above means the ref is always a
          # v*.*.* tag by the time we get here, so there is no branch case left
          # to describe and no `edge`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=small-share-app
            org.opencontainers.image.description=Hand a file from an agent to a human, and back

      # The builder stage runs t/share.t, so this cannot publish an image whose
      # tests do not pass — the same guarantee ci.yml gives on every push to
      # main, enforced again here because a tag can be cut from a commit CI
      # never saw.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # TEMPORARY, and it should be `linux/amd64,linux/arm64`.
          #
          # The arm64 leg fails in `pdi-build-deps` — the CPAN install — about
          # twenty minutes in, under QEMU. It has been failing since some point
          # after v1.0.0: v1.1.0, v1.2.0 and v1.2.1 were all tagged and none of
          # them published, so GHCR's `latest` sat on 1.0.0 for two releases
          # while the tags existed in git. Nobody noticed, because a push to
          # main was still publishing :main and :edge on amd64 alone, and that
          # was the only thing succeeding.
          #
          # A release that does not exist is worse than a release that runs on
          # one architecture, so this ships amd64 and says so. `multiarch.yml`
          # builds BOTH on any non-main branch — that is where the arm64 fix
          # gets worked out, at no cost to anybody who is not working on it.
          # Put the second platform back here the moment it is green there.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "| registry | tags |"
            echo "|---|---|"
            echo "| \`${{ env.GHCR_IMAGE }}\` | \`${{ steps.meta.outputs.version }}\` |"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              echo "| \`${{ steps.hub.outputs.repo }}\` | \`${{ steps.meta.outputs.version }}\` |"
            else
              echo "| Docker Hub | skipped, no credentials |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
