# small-share-app behind a Tailscale sidecar.
#
# Two containers: the app, and a Tailscale node that fronts it with `tailscale
# serve`. The app publishes no host ports at all — the sidecar is the only way
# in, and the service appears on your tailnet as
#
#     https://<TS_HOSTNAME>.<your-tailnet>.ts.net
#
# with a real Let's Encrypt certificate that Tailscale obtains and renews for
# you. Nothing about it is reachable from the public internet.
#
# Quick start:
#
#     cp .env.example .env      # then put a Tailscale auth key in it
#     docker compose up -d
#
# For a plain local run with no Tailscale at all, use docker-compose.local.yml.

services:

  share:
    image: ${SHARE_IMAGE:-ghcr.io/melo/small-share-app:latest}
    # To run your own build instead of the published image:
    #   docker compose build && docker compose up -d
    build: .

    # A distinct network alias, because the sidecar's own tailnet hostname is
    # also "share" and Docker's embedded DNS would otherwise have two answers
    # for the same name.
    networks:
      default:
        aliases: [share-app]

    # Own the data directory as a real user so the SQLite file and the stored
    # files stay readable from the host without sudo. Defaults to the first
    # non-root account on most systems; set SHARE_UID/SHARE_GID in .env if not.
    user: "${SHARE_UID:-1000}:${SHARE_GID:-1000}"

    environment:
      # The one workspace directory: share.db and files/ both live under it.
      SHARE_ROOT: /workspace

      # Optional. Every URL handed to an agent is built from this. Leave it
      # unset and the app derives it from the request, which works correctly
      # behind `tailscale serve` — but setting it explicitly means the URL never
      # depends on a header.
      SHARE_BASE_URL: ${SHARE_BASE_URL:-}

      # Retention, and the ceiling any single upload may ask for.
      SHARE_TTL_DAYS: ${SHARE_TTL_DAYS:-15}

      # Per-file limit, in bytes. 32 MB by default.
      SHARE_MAX_BYTES: ${SHARE_MAX_BYTES:-33554432}

      # Everything held at once. Over it the OLDEST files are evicted until the
      # total fits again, rather than uploads being refused: a full disk takes
      # the service down, a lost two-week-old file does not. The value repeats
      # the application's own default, so passing it changes nothing until an
      # operator sets it — but without the line here, setting it in .env does
      # nothing at all, silently.
      SHARE_MAX_TOTAL_BYTES: ${SHARE_MAX_TOTAL_BYTES:-53687091200}

      # Lets /api/v1/health, and only that, report how many files and bytes are
      # held. Off unless asked for: it is inventory, and an instance a stranger
      # can reach should not hand it over. Set SHARE_HEALTH_DETAIL=1 in .env on
      # a private deployment whose collector needs the numbers.
      SHARE_HEALTH_DETAIL: ${SHARE_HEALTH_DETAIL:-0}

      # Chat rooms: how big one message may be, how many a room keeps before the
      # oldest go, and how fast one caller may post or open a room. Counted in a
      # bucket of their own, so a busy room never stops anybody sharing a file.
      # The values repeat the application's own defaults — but without these
      # lines, setting them in .env would do nothing at all, silently.
      SHARE_CHAT_MAX_MESSAGE_BYTES: ${SHARE_CHAT_MAX_MESSAGE_BYTES:-16384}
      SHARE_CHAT_MAX_MESSAGES: ${SHARE_CHAT_MAX_MESSAGES:-5000}
      SHARE_CHAT_RATE_PER_SECOND: ${SHARE_CHAT_RATE_PER_SECOND:-5}
      SHARE_CHAT_RATE_PER_MINUTE: ${SHARE_CHAT_RATE_PER_MINUTE:-60}

      # How long a caller may park on a room waiting for the next thing to
      # happen. Fifteen minutes is what turns a backgrounded curl into a wake-up
      # instead of a poll. If something in front of this cuts long responses --
      # a proxy with a short read timeout -- lower it here rather than making
      # every watcher go back to asking in a loop.
      SHARE_CHAT_MAX_WAIT: ${SHARE_CHAT_MAX_WAIT:-900}

      # How long before a room expires it says so, in the room, once. It is the
      # only warning anyone gets that a fortnight of coordination is about to be
      # deleted.
      SHARE_CHAT_EXPIRY_WARNING: ${SHARE_CHAT_EXPIRY_WARNING:-7200}

      # Whether writing to a room requires the member_token that join hands back
      # once. ON by default: without it a room URL is the credential for writing
      # as well as reading, so anyone who was ever handed one can post as any
      # member, rename them, or mark them gone. Set to 0 only for an instance
      # whose agents cannot be restarted yet.
      SHARE_CHAT_REQUIRE_TOKEN: ${SHARE_CHAT_REQUIRE_TOKEN:-1}

      # Addresses and CIDR networks whose X-Forwarded-For this believes, as a
      # comma-separated list -- bare addresses or real networks, v4 and v6
      # alike (172.18.0.1, 10.0.0.0/8, 2400:cb00::/32). Mojolicious walks the
      # header from the right with the socket peer appended, drops every hop
      # that falls inside one of these, and counts the first that does not: the
      # nearest hop nobody here vouched for, and so the one address a caller
      # cannot choose for itself.
      #
      # Empty is right for this stack: the app's port is reachable from the
      # tailscale sidecar and from nothing else, so the right-most entry -- the
      # one MOJO_REVERSE_PROXY alone takes -- was written by that sidecar. Fill
      # it in when something further out is the real edge, Cloudflare's
      # published ranges being the usual case.
      #
      # Erring generous is what this guards against: believing a forwarded
      # address from anyone lets a caller rotate it to escape the rate limit,
      # or put somebody else's address in it to throttle them out of a room.
      MOJO_TRUSTED_PROXIES: ${MOJO_TRUSTED_PROXIES:-}

      # Retired, and forwarded anyway on purpose: the app refuses to start when
      # this arrives with a value, and names MOJO_TRUSTED_PROXIES instead. An
      # .env still carrying the old spelling stops the stack rather than
      # quietly counting the wrong thing -- which is what the old setting did on any
      # stack with MOJO_REVERSE_PROXY on, where it was matched against a
      # forwarded address and so could never match the proxy at all. Expected to
      # go in a later release.
      SHARE_TRUSTED_PROXIES: ${SHARE_TRUSTED_PROXIES:-}

      # How long a member may say nothing at all before the room concludes they
      # are gone and says so in the transcript. The room page keeps itself alive
      # every 60-90 seconds; five minutes survives a closed lid, a throttled
      # background tab and a bad minute of network.
      SHARE_CHAT_PRESENCE_TIMEOUT: ${SHARE_CHAT_PRESENCE_TIMEOUT:-300}

      # How many callers may be parked on one room at once, per worker. Reads
      # are deliberately not rate limited -- a limit on reads is a limit on
      # following a room -- but a park holds a connection, a timer and a database
      # handle for up to SHARE_CHAT_MAX_WAIT, and nothing else bounds them.
      SHARE_CHAT_MAX_WAITERS: ${SHARE_CHAT_MAX_WAITERS:-32}

      # One line of deployment truth the app cannot know: who can reach this and
      # who to ask for access. Shown on the home page and handed to every agent
      # in the MCP instructions.
      SHARE_NOTICE: ${SHARE_NOTICE:-}

      MOJO_MODE: production
      # The sidecar terminates TLS and forwards X-Forwarded-*; without this the
      # app would report every request as plain http on its own container port.
      # It also decides who the rate limiter counts: with MOJO_TRUSTED_PROXIES
      # empty the right-most X-Forwarded-For entry is believed, which is safe
      # here only because the app's port is reachable from the sidecar that
      # wrote it and from nothing else. Front this with anything further out --
      # Cloudflare, say -- and MOJO_TRUSTED_PROXIES has to be filled in.
      MOJO_REVERSE_PROXY: "1"

    volumes:
      # A plain host directory, not a named volume, so the data can be listed,
      # backed up and grepped without going through docker.
      - ${SHARE_DATA:-./data}:/workspace

    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  # The Tailscale node. `tailscale serve` is the standard way to put an HTTP
  # service on a tailnet: it joins as its own node, gets its own certificate,
  # and reverse-proxies to the app over the private compose network.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-share}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY in .env — see .env.example}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME:-share}
      # Userspace networking needs no NET_ADMIN and no /dev/net/tun, which keeps
      # this container unprivileged. Fine for proxying HTTP; you would only want
      # kernel networking if this node also had to route traffic.
      - TS_USERSPACE=true
      # Keep Docker's embedded DNS, so the "share-app" alias resolves to the app
      # container rather than to the tailnet node that shares its name.
      - TS_ACCEPT_DNS=false
    volumes:
      # Node identity — a few KB. Lose it and the node re-registers under a new
      # identity, which means a new certificate and another approval if your
      # tailnet has lock enabled.
      - tailscale-state:/var/lib/tailscale
      # The serve config is kept strictly minimal and comment-free on purpose: a
      # malformed one takes the whole deployment down and the failure is opaque.
      # What it says:
      #
      #   * terminate HTTPS on :443 with the certificate Tailscale manages
      #   * proxy everything to the app container's "share-app" alias
      #
      # ${TS_CERT_DOMAIN} is substituted by this container at startup with the
      # node's own MagicDNS name — which is why nothing in this repo has to know
      # your tailnet, and why the file works unchanged for everybody.
      #
      # To publish on the PUBLIC internet instead of just your tailnet, add
      #   "AllowFunnel": { "${TS_CERT_DOMAIN}:443": true }
      # at the top level and enable Funnel for the node in the admin console.
      # Read the README's security section first: with no authentication, the
      # secret URL becomes the only thing between your files and the internet.
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on: [share]
    restart: unless-stopped

volumes:
  tailscale-state:
