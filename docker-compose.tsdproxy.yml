# small-share-app exposed by tsdproxy.
#
# For a host that already runs tsdproxy (https://github.com/almeidapaulopt/tsdproxy):
# it watches Docker for labelled containers and gives each one its own Tailscale
# node, with a real certificate, reached on the container's private docker IP.
# No sidecar per service, no published port, no auth key in this stack.
#
#   docker compose -f docker-compose.tsdproxy.yml up -d
#
# Compared with docker-compose.yml, which runs a `tailscale serve` sidecar: this
# is less to run when you already have tsdproxy, and nothing at all when you do
# not. Pick one.
#
# NOTE: this label creates a real tailnet node. If your tailnet has lock
# enabled, it registers but stays unreachable until you sign it — and do not
# check that from this host, because local tailscaled resolves and serves an
# unsigned node's own name on its own machine. Test from another device.

services:

  share:
    image: ${SHARE_IMAGE:-ghcr.io/melo/small-share-app:latest}

    # A distinct alias, in case the tailnet node and this container end up
    # sharing a name on the same docker network.
    networks:
      default:
        aliases: [share-app]

    # Own the data directory as a real account so the SQLite file and the stored
    # files stay readable from a normal shell. `id -u`, `id -g`.
    user: "${SHARE_UID:-1000}:${SHARE_GID:-1000}"

    environment:
      SHARE_ROOT: /workspace

      # What every share URL is built from. Set explicitly rather than derived
      # from headers: the value ends up pasted into a conversation.
      SHARE_BASE_URL: ${SHARE_BASE_URL:?set SHARE_BASE_URL, e.g. https://share.your-tailnet.ts.net}

      SHARE_TTL_DAYS: ${SHARE_TTL_DAYS:-15}
      SHARE_MAX_BYTES: ${SHARE_MAX_BYTES:-33554432}
      SHARE_MAX_TOTAL_BYTES: ${SHARE_MAX_TOTAL_BYTES:-53687091200}
      SHARE_NOTICE: ${SHARE_NOTICE:-}

      # Lets /api/v1/health, and only that, report how many files and bytes are
      # held. Off unless asked for, on a tailnet as anywhere else: it is
      # inventory, and "everyone on the tailnet" is not always a short list.
      # Set SHARE_HEALTH_DETAIL=1 in .env if your collector needs the numbers.
      SHARE_HEALTH_DETAIL: ${SHARE_HEALTH_DETAIL:-0}

      # Chat rooms: how big one message may be, how many a room keeps before the
      # oldest go, and how fast one caller may post or open a room. Counted in a
      # bucket of their own, so a busy room never stops anybody sharing a file.
      # The values repeat the application's own defaults — but without these
      # lines, setting them in .env would do nothing at all, silently.
      SHARE_CHAT_MAX_MESSAGE_BYTES: ${SHARE_CHAT_MAX_MESSAGE_BYTES:-16384}
      SHARE_CHAT_MAX_MESSAGES: ${SHARE_CHAT_MAX_MESSAGES:-5000}
      SHARE_CHAT_RATE_PER_SECOND: ${SHARE_CHAT_RATE_PER_SECOND:-5}
      SHARE_CHAT_RATE_PER_MINUTE: ${SHARE_CHAT_RATE_PER_MINUTE:-60}

      # How long a caller may park on a room waiting for the next thing to
      # happen. Fifteen minutes is what turns a backgrounded curl into a wake-up
      # instead of a poll. If something in front of this cuts long responses --
      # a proxy with a short read timeout -- lower it here rather than making
      # every watcher go back to asking in a loop.
      SHARE_CHAT_MAX_WAIT: ${SHARE_CHAT_MAX_WAIT:-900}

      # How long before a room expires it says so, in the room, once. It is the
      # only warning anyone gets that a fortnight of coordination is about to be
      # deleted.
      SHARE_CHAT_EXPIRY_WARNING: ${SHARE_CHAT_EXPIRY_WARNING:-7200}

      # Whether posting requires the member_token that join hands back once.
      # Off by default for one release: without it a session id is a claim
      # rather than a credential, and session ids used to be published on every
      # message. Turn it on once the agents talking to this instance have been
      # restarted.
      SHARE_CHAT_REQUIRE_TOKEN: ${SHARE_CHAT_REQUIRE_TOKEN:-0}

      # How long a member may say nothing at all before the room concludes they
      # are gone and says so in the transcript. The room page keeps itself alive
      # every 60-90 seconds; five minutes survives a closed lid, a throttled
      # background tab and a bad minute of network.
      SHARE_CHAT_PRESENCE_TIMEOUT: ${SHARE_CHAT_PRESENCE_TIMEOUT:-300}

      MOJO_MODE: production
      # tsdproxy terminates TLS and forwards X-Forwarded-*.
      MOJO_REVERSE_PROXY: "1"

    volumes:
      # A plain host directory, so the data can be listed, backed up and grepped
      # without going through docker.
      - ${SHARE_DATA:?set SHARE_DATA, the host directory holding share.db and files/}:/workspace

    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "${TS_HOSTNAME:-share}"
      tsdproxy.container_port: "8080"

    ports:
      # Loopback ONLY, and solely so a host-local collector can reach the health
      # endpoint. Nothing off-host can use this; tsdproxy stays the only way in.
      # Never publish it on 0.0.0.0. Comment it out if you have no collector.
      - "127.0.0.1:${SHARE_LOOPBACK_PORT:-3310}:8080"

    restart: unless-stopped
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD", "perl", "/app/bin/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
